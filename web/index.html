<body>
  <style>
    #vg-loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      background: #F6E3E3;
      color: #872B3F;
      font-family: system-ui, sans-serif;
      z-index: 9999;
      padding: 1.5rem;
      text-align: center;
    }
    #vg-loading p { margin: 0; font-size: 1rem; }
    #vg-loading small { color: #6b4a52; max-width: 28rem; }
    #vg-loading.error { background: #fff5f5; color: #8b1a1a; }
  </style>
  <div id="vg-loading">
    <p><strong>Loading Verified Glam Scanner…</strong></p>
    <small id="vg-loading-hint">First load may take a moment while the app starts.</small>
  </div>
  <script>
    (function () {
      var loading = document.getElementById('vg-loading');
      var hint = document.getElementById('vg-loading-hint');
      var bootFailed = false;
      var isLocalHost =
        location.hostname === 'localhost' ||
        location.hostname === '127.0.0.1';

      function flutterMounted() {
        return !!document.querySelector(
          'flt-glass-pane, flutter-view, flt-scene-host, flt-scene'
        );
      }

      function hideLoading() {
        if (loading && document.body.contains(loading)) {
          loading.remove();
        }
      }

      function showError(msg) {
        if (!loading || bootFailed) return;
        if (flutterMounted()) {
          hideLoading();
          return;
        }
        bootFailed = true;
        loading.classList.add('error');
        loading.innerHTML = '<p><strong>Could not load the app</strong></p><small>' + msg + '</small>';
      }
      window.__vgShowBootError = showError;

      window.addEventListener('flutter-first-frame', hideLoading);

      // flutter run -d web-server often skips flutter-first-frame; watch for Flutter DOM.
      var mountObserver = new MutationObserver(function () {
        if (flutterMounted()) {
          hideLoading();
          mountObserver.disconnect();
        }
      });
      mountObserver.observe(document.body, { childList: true, subtree: true });

      window.addEventListener('error', function (e) {
        var msg = e.message || 'Unknown error';
        if (msg.indexOf('PasskeyAuthenticator') >= 0 || msg.indexOf("'init'") >= 0) {
          msg = 'Passkeys web SDK failed to load. Ensure js/passkeys-bundle.js is present.';
        }
        showError(msg + ' Press Ctrl+Shift+R to hard refresh.');
      });

      window.addEventListener('unhandledrejection', function (e) {
        var reason = e.reason && (e.reason.message || e.reason.toString());
        if (reason) showError(reason);
      });

      setTimeout(function () {
        if (loading && document.body.contains(loading) && !bootFailed) {
          hint.textContent = isLocalHost
            ? 'Still compiling… first debug load can take 1–3 minutes.'
            : 'Still loading… large first download can take 1–2 minutes on slow networks.';
        }
      }, 45000);

      setTimeout(function () {
        if (!loading || !document.body.contains(loading) || bootFailed) return;
        if (flutterMounted()) {
          hideLoading();
          return;
        }
        showError(
          isLocalHost
            ? 'Startup timed out. Stop any old server (port 8080), run .\\scripts\\run-web-dev.ps1 again, wait for Chrome to open, or use .\\scripts\\serve-web.ps1 after .\\scripts\\build-web.ps1.'
            : 'Startup timed out. Open DevTools → Network and confirm flutter_bootstrap.js and main.dart.js return 200. ' +
              'In Cloudflare: build output must be build/web (not web/), deploy command must be empty. ' +
              'Then clear site data for this host and reload in Chrome or Edge.'
        );
      }, isLocalHost ? 300000 : 180000);

      function loadFlutterBootstrap() {
        var s = document.createElement('script');
        s.src = 'flutter_bootstrap.js';
        s.async = true;
        s.onerror = function () {
          window.__vgShowBootError && window.__vgShowBootError('flutter_bootstrap.js failed to load.');
        };
        document.body.appendChild(s);
      }

      function checkAsset(path, help) {
        fetch(path, { method: 'GET', cache: 'no-store' }).then(function (res) {
          if (!res.ok && !bootFailed) {
            showError(path + ' returned HTTP ' + res.status + '. ' + help);
          }
        }).catch(function () {
          if (!bootFailed) showError('Could not reach ' + path + '. ' + help);
        });
      }

      function startAssetChecks() {
        checkAsset(
          'flutter_bootstrap.js',
          'Cloudflare is probably serving the web/ source folder instead of build/web/. Set Build output directory to build/web and remove any deploy command.'
        );
        setTimeout(function () {
          checkAsset('main.dart.js', 'Flutter build output is missing from the deployed site.');
        }, 3000);
      }

      if (isLocalHost) {
        loadFlutterBootstrap();
      } else {
        // A service worker from an older deploy can keep intercepting every
        // navigation on this origin (including deep links like /app/*?vg_token=...)
        // and serving its own stale cached shell — no amount of redeploying
        // fixes this until the worker controlling THIS tab is gone. Unregistering
        // only stops it from controlling *future* navigations, so once we find
        // one, force a single reload (guarded so it can't loop) to actually
        // escape it before loading anything else. Bump this key whenever a
        // real deploy regression needs everyone's stale worker force-cleared
        // even mid-session (sessionStorage never expires the old guard on its own).
        var swKey = 'vg-sw-cleared-v3';
        var reloadKey = 'vg-sw-reloaded-v3';
        var alreadyReloaded = sessionStorage.getItem(reloadKey) === '1';

        var clearCaches = window.caches
          ? caches.keys().then(function (keys) { return Promise.all(keys.map(function (k) { return caches.delete(k); })); })
          : Promise.resolve();

        var clearServiceWorkers = ('serviceWorker' in navigator)
          ? navigator.serviceWorker.getRegistrations().then(function (regs) {
              return Promise.all(regs.map(function (r) { return r.unregister(); })).then(function () {
                return regs.length > 0;
              });
            })
          : Promise.resolve(false);

        Promise.all([clearServiceWorkers, clearCaches]).then(function (results) {
          var hadServiceWorker = results[0];
          sessionStorage.setItem(swKey, '1');
          if (hadServiceWorker && !alreadyReloaded) {
            sessionStorage.setItem(reloadKey, '1');
            window.location.reload();
            return;
          }
          startAssetChecks();
          loadFlutterBootstrap();
        }).catch(function () {
          // Cleanup itself failing shouldn't block boot — proceed anyway.
          startAssetChecks();
          loadFlutterBootstrap();
        });
      }
    })();
  </script>
  <script src="js/passkeys-bundle.js"></script>
